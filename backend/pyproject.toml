[project]
name = "raid-analyst"
version = "0.1.0"
description = "LLM-powered WarcraftLogs-style raid analysis: ingests combat logs, computes per-player/raid stats, and coaches via a provider-agnostic LLM."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
